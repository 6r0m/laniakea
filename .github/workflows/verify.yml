name: Verify

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  synthetic:
    name: Windows synthetic tests
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24'
      - name: Python checks
        run: python -B -m unittest discover -s tests
      - name: Viewer unit tests
        run: node --test "tests/*.test.cjs"
      - name: Install browser test tools
        run: |
          npm.cmd ci --prefix tests --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/node_modules/playwright-core/cli.js install --only-shell chromium
      - name: Browser acceptance
        run: python -B tests/browser_acceptance.py --channel chromium
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-traces
          path: workspace/tmp/browser-failures/*.zip
          if-no-files-found: ignore
          retention-days: 7
